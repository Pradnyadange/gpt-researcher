<!DOCTYPE html>
<html lang="en" data-color-mode="dark">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - DevAgent Ultimate</title>
    <!-- Include Mermaid.js for visual graph & diagram rendering -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    </script>
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: #0d1117;
            --border-color: #21262d;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
            --code-bg: #010409;
            --badge-bg: rgba(110, 118, 129, 0.1);
            --sidebar-width: 270px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-rows: 60px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--card-bg);
            z-index: 100;
        }

        .logo {
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            text-decoration: none;
        }

        .app-layout {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            height: calc(100vh - 60px);
            overflow: hidden;
        }

        .sidebar {
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .sidebar-menu {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: var(--badge-bg);
        }

        .sidebar-repos-header {
            padding: 12px 16px 6px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .repo-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .repo-nav-item:hover,
        .repo-nav-item.active {
            background: var(--badge-bg);
            color: var(--text-main);
        }

        .main-dashboard {
            background: var(--bg-color);
            padding: 24px 30px;
            overflow-y: auto;
        }

        .greeting-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .copilot-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .copilot-textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 45px;
            font-family: inherit;
        }

        .copilot-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 6px;
        }

        .action-pills-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .action-pill-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: 0.2s;
        }

        .action-pill-btn:hover {
            border-color: #3fb950;
            background: var(--badge-bg);
        }

        .formatted-report h3 {
            color: #58a6ff;
            font-size: 14px;
            margin-top: 12px;
            margin-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .formatted-report p {
            margin: 3px 0;
            color: var(--text-main);
        }

        .formatted-report ul {
            margin: 3px 0;
            padding-left: 16px;
        }

        .formatted-report li {
            margin-bottom: 3px;
            color: var(--text-main);
        }

        .formatted-report strong {
            color: #3fb950;
        }

        .mermaid {
            background: var(--code-bg);
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            overflow-x: auto;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 850px;
            max-width: 92%;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
            margin-top: 14px;
        }

        .btn-main {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-secondary {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 11px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <nav>
        <div class="nav-left">
            <a href="/dashboard" class="logo">🚀 DevAgent Ultimate Dashboard</a>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
            <div style="cursor: pointer;" onclick="openPreferencesModal()" title="Preferences">⚙️</div>
            <div style="background: #8957e5; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; cursor: pointer;"
                onclick="window.location.href='/'">PD</div>
        </div>
    </nav>

    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-menu"><a href="/dashboard" class="sidebar-item">🏠 Home</a></div>
            <div class="sidebar-repos-header">Repositories</div>
            <div id="sidebarRepoList">
                <div style="padding: 10px; font-size: 12px; color: var(--text-muted);">Loading...</div>
            </div>
        </div>

        <div class="main-dashboard">
            <div class="greeting-title">Dashboard & Advanced Agent Suite</div>

            <!-- Copilot Box -->
            <div class="copilot-box">
                <textarea id="copilotPromptInput" class="copilot-textarea"
                    placeholder="Ask anything about your repository..."></textarea>
                <div class="copilot-toolbar">
                    <span style="font-size: 12px; color: var(--text-muted);" id="selectedRepoContextLabel">📂 Select
                        Repo</span>
                    <button class="btn-main" onclick="sendCopilotQuery()">Ask AI ➔</button>
                </div>
            </div>

            <!-- Ultimate Agent Suite Feature Pills -->
            <div class="action-pills-row">
                <button class="action-pill-btn" onclick="openInteractiveModal('mapping')">📌 Issue → Code Map</button>
                <button class="action-pill-btn" onclick="openInteractiveModal('solver')">🛠️ Issue Solver</button>
                <button class="action-pill-btn" onclick="openInteractiveModal('pr')">🔍 PR Review Agent</button>
                <button class="action-pill-btn"
                    onclick="openSimpleModal('Commit Analyzer', '/api/repo/commit-analyzer')">📈 AI Commit
                    Analyzer</button>
                <button class="action-pill-btn" onclick="openSimpleModal('Commit Risk', '/api/repo/commit-risk')">⚠️
                    Commit Risk Score</button>
                <button class="action-pill-btn"
                    onclick="openSimpleModal('Dependencies', '/api/repo/dependency-analyzer')">📦 Dependency
                    Analyzer</button>
                <button class="action-pill-btn"
                    onclick="openSimpleModal('Architecture', '/api/repo/architecture-visualizer')">🏛️ Architecture
                    Visualizer</button>
                <button class="action-pill-btn"
                    onclick="openSimpleModal('Relationship Graph', '/api/repo/relationship-graph')">🧬 Relationship
                    Graph</button>
                <button class="action-pill-btn"
                    onclick="openSimpleModal('Performance', '/api/repo/performance-investigator')">⚡ Performance
                    Investigator</button>
                <button class="action-pill-btn"
                    onclick="openSimpleModal('Refactoring', '/api/repo/refactoring-suggestions')">💡 AI
                    Refactoring</button>
            </div>

            <!-- Results Box -->
            <div id="result-container"
                style="background: var(--card-bg); border: 1px solid var(--border-color); border-left: 4px solid #3fb950; padding: 16px; border-radius: 8px; display: none; margin-bottom: 30px;">
                <div id="report-content" class="formatted-report"></div>
            </div>
        </div>
    </div>

    <!-- Interactive Input Modal -->
    <div id="interactiveModal" class="modal-overlay">
        <div class="modal-card" style="width: 550px;">
            <button class="modal-close" onclick="closeInteractiveModal()">✕</button>
            <h2 id="interactiveModalTitle" style="color: #58a6ff; font-size: 15px; margin-top: 0;">Input Required</h2>
            <p id="interactiveModalDesc" style="font-size: 12px; color: var(--text-muted);">Provide input:</p>
            <textarea id="interactiveInput" class="copilot-textarea"
                style="background: var(--code-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; min-height: 70px; margin-bottom: 12px;"
                placeholder="Type here..."></textarea>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeInteractiveModal()">Cancel</button>
                <button class="btn-main" onclick="submitInteractiveAction()">Run Agent ➔</button>
            </div>
        </div>
    </div>

    <!-- Feature Output Modal -->
    <div id="featureModal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeFeatureModal()">✕</button>
            <h2 id="modalFeatureTitle" style="color: #58a6ff; font-size: 15px; margin-top: 0;">Agent Report</h2>
            <div id="modalFeatureBody" class="formatted-report"
                style="font-size: 12px; line-height: 1.5; max-height: 60vh; overflow-y: auto;">Processing...</div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeFeatureModal()">Close</button>
                <button class="btn-main" onclick="copyModalContent()">Copy Report</button>
            </div>
        </div>
    </div>

    <!-- Preferences Modal -->
    <div id="preferencesModal" class="modal-overlay">
        <div class="modal-card" style="width: 500px;">
            <button class="modal-close" onclick="closePreferencesModal()">✕</button>
            <h2 style="color: #58a6ff; font-size: 15px; margin-top: 0;">⚙️ Developer Preferences</h2>
            <textarea id="preferencesInput" class="copilot-textarea"
                style="background: var(--code-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; min-height: 100px; margin-bottom: 12px;"></textarea>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closePreferencesModal()">Cancel</button>
                <button class="btn-main" onclick="saveDeveloperPreferences()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let currentSelectedRepo = "";
        let modalLatestText = "";
        let currentInteractiveMode = "";

        fetch('/api/repos').then(res => res.json()).then(data => {
            const list = document.getElementById("sidebarRepoList");
            if (data.repositories && data.repositories.length > 0) {
                list.innerHTML = "";
                data.repositories.forEach(repo => {
                    const item = document.createElement("a");
                    item.className = "repo-nav-item";
                    item.id = `repo-${repo.full_name.replace('/', '-')}`;
                    item.innerText = repo.full_name;
                    item.onclick = () => selectRepository(repo.full_name);
                    list.appendChild(item);
                });
                selectRepository(data.repositories[0].full_name);
            }
        });

        function selectRepository(fullName) {
            currentSelectedRepo = fullName;
            document.getElementById("selectedRepoContextLabel").innerText = `📂 ${fullName}`;
            document.querySelectorAll('.repo-nav-item').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`repo-${fullName.replace('/', '-')}`);
            if (activeEl) activeEl.classList.add('active');
        }

        function formatMarkdownToHtml(text) {
            if (!text) return "";

            let mermaidBlocks = [];

            // 1. Extract and sanitize mermaid blocks (auto-fix missing newline after graph TD/LR)
            let processed = text.replace(/```mermaid([\s\S]*?)```/g, function (match, p1) {
                let cleanCode = p1.replace(/<\/?[^>]+(>|$)/g, "").trim();
                // Ensure graph declaration has a newline after it
                cleanCode = cleanCode.replace(/^(graph\s+(?:TD|LR|TB|BT|RL))\s*/i, '$1\n');

                let index = mermaidBlocks.length;
                mermaidBlocks.push(cleanCode);
                return `___MERMAID_PLACEHOLDER_${index}___`;
            });

            // 2. Format standard Markdown headings, bold, italics, and line breaks
            let html = processed
                .replace(/###\s+(.*)/g, '<h3>$1</h3>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');

            // 3. Put clean Mermaid blocks back as valid renderable divs
            mermaidBlocks.forEach((code, index) => {
                html = html.replace(`___MERMAID_PLACEHOLDER_${index}___`, `<div class="mermaid">${code}</div>`);
            });

            setTimeout(() => {
                mermaid.run();
            }, 300);

            return html;
        }

        function sendCopilotQuery() {
            const query = document.getElementById("copilotPromptInput").value.trim();
            if (!query || !currentSelectedRepo) { alert("Select repository and enter query."); return; }
            const [owner, repo] = currentSelectedRepo.split("/");
            const rc = document.getElementById("result-container");
            const rf = document.getElementById("report-content");
            rc.style.display = "block"; rc.scrollIntoView({ behavior: 'smooth', block: 'start' });
            rf.innerHTML = "🤖 Analyzing...";

            fetch('/api/agent/query', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, owner, repo })
            }).then(res => res.json()).then(data => { rf.innerHTML = formatMarkdownToHtml(data.answer); });
        }

        function openSimpleModal(title, endpoint) {
            if (!currentSelectedRepo) { alert("Select repository first."); return; }
            const [owner, repo] = currentSelectedRepo.split("/");
            document.getElementById("modalFeatureTitle").innerText = `Agent Report: ${title}`;
            document.getElementById("modalFeatureBody").innerHTML = "Running analysis & rendering graph...";
            document.getElementById("featureModal").style.display = "flex";

            fetch(endpoint, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ owner, repo })
            }).then(res => res.json()).then(data => {
                modalLatestText = data.analysis;
                document.getElementById("modalFeatureBody").innerHTML = formatMarkdownToHtml(data.analysis);
            });
        }

        function openInteractiveModal(mode) {
            if (!currentSelectedRepo) { alert("Select repository first."); return; }
            currentInteractiveMode = mode;
            const prompts = {
                mapping: ["📌 Issue → Code Mapping", "Paste GitHub Issue description or title:"],
                solver: ["🛠️ Issue Solver Agent", "Describe the issue or bug to solve:"],
                pr: ["🔍 PR Review Agent", "Enter Pull Request # or branch name:"]
            };
            document.getElementById("interactiveModalTitle").innerText = prompts[mode][0];
            document.getElementById("interactiveModalDesc").innerText = prompts[mode][1];
            document.getElementById("interactiveInput").value = "";
            document.getElementById("interactiveModal").style.display = "flex";
        }

        function closeInteractiveModal() { document.getElementById("interactiveModal").style.display = "none"; }

        function submitInteractiveAction() {
            const val = document.getElementById("interactiveInput").value.trim();
            if (!val) { alert("Please enter input."); return; }
            closeInteractiveModal();
            const [owner, repo] = currentSelectedRepo.split("/");

            let endpoint = "";
            let payload = { owner, repo };
            if (currentInteractiveMode === 'mapping') { endpoint = '/api/repo/issue-mapping'; payload.issue = val; }
            else if (currentInteractiveMode === 'solver') { endpoint = '/api/repo/issue-solver'; payload.issue = val; }
            else if (currentInteractiveMode === 'pr') { endpoint = '/api/repo/pr-review'; payload.pr_number = val; }

            document.getElementById("modalFeatureTitle").innerText = `Agent Report: ${currentInteractiveMode.toUpperCase()}`;
            document.getElementById("modalFeatureBody").innerHTML = "Running AI execution...";
            document.getElementById("featureModal").style.display = "flex";

            fetch(endpoint, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                modalLatestText = data.analysis;
                document.getElementById("modalFeatureBody").innerHTML = formatMarkdownToHtml(data.analysis);
            });
        }

        function closeFeatureModal() { document.getElementById("featureModal").style.display = "none"; }
        function openPreferencesModal() {
            fetch('/api/memory/preferences').then(res => res.json()).then(data => {
                document.getElementById("preferencesInput").value = data.preferences === "No specific preferences set." ? "" : data.preferences;
                document.getElementById("preferencesModal").style.display = "flex";
            });
        }
        function closePreferencesModal() { document.getElementById("preferencesModal").style.display = "none"; }
        function saveDeveloperPreferences() {
            const prefs = document.getElementById("preferencesInput").value.trim();
            fetch('/api/memory/preferences', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ preferences: prefs })
            }).then(() => { alert("Saved!"); closePreferencesModal(); });
        }
        function copyModalContent() { navigator.clipboard.writeText(modalLatestText); alert("Copied!"); }
    </script>
</body>

</html>
